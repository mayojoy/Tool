name: Generate routing rules for Surge

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          set -e
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

          echo "custom_icloud=https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/icloud.txt" >> $GITHUB_ENV
          echo "custom_tld_not_cn=https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/tld-!cn.txt" >> $GITHUB_ENV
          echo "custom_private=https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/private.txt" >> $GITHUB_ENV

          echo "Loyalsoldier_reject=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/reject-list.txt" >> $GITHUB_ENV
          echo "Loyalsoldier_proxy=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/proxy-list.txt" >> $GITHUB_ENV
          echo "Loyalsoldier_direct=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/direct-list.txt" >> $GITHUB_ENV
          echo "Loyalsoldier_gfw=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/gfw.txt" >> $GITHUB_ENV
          echo "Loyalsoldier_greatfire=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/greatfire.txt" >> $GITHUB_ENV

          echo "felixonmars_apple=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf" >> $GITHUB_ENV
          echo "felixonmars_google=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf" >> $GITHUB_ENV

          echo "cn_cidr=https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt" >> $GITHUB_ENV
          echo "telegram_cidr=https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/telegram.txt" >> $GITHUB_ENV
        shell: bash

      - name: Create directories
        run: |
          mkdir -p ruleset publish

      # ---------- iCloud ----------
      - name: Generate icloud rules
        run: |
          curl -sSL ${custom_icloud} | grep -E "^full:" | awk -F ':' '{print $2}' > icloud.txt
          curl -sSL ${custom_icloud} | grep -E "^domain:" | awk -F ':' '{print "."$2}' >> icloud.txt

          curl -sSL ${custom_icloud} | grep -E "^full:" | awk -F ':' '{print "DOMAIN,"$2}' > ruleset/icloud.txt
          curl -sSL ${custom_icloud} | grep -E "^domain:" | awk -F ':' '{print "DOMAIN-SUFFIX,"$2}' >> ruleset/icloud.txt

      # ---------- Google ----------
      - name: Generate google rules
        run: |
          curl -sSL ${felixonmars_google} | perl -ne '/^server=\/([^\/]+)\// && print ".$1\n"' > google.txt
          curl -sSL ${felixonmars_google} | perl -ne '/^server=\/([^\/]+)\// && print "DOMAIN-SUFFIX,$1\n"' > ruleset/google.txt

      # ---------- Apple ----------
      - name: Generate apple rules
        run: |
          curl -sSL ${felixonmars_apple} | perl -ne '/^server=\/([^\/]+)\// && print ".$1\n"' > apple.txt
          curl -sSL ${felixonmars_apple} | perl -ne '/^server=\/([^\/]+)\// && print "DOMAIN-SUFFIX,$1\n"' > ruleset/apple.txt

      # ---------- Direct ----------
      - name: Generate direct rules
        run: |
          curl -sSL ${Loyalsoldier_direct} | grep -Ev "^(regexp|keyword):" | perl -ne '/^full:(.+)$/ && print "$1\n"' > direct.txt
          curl -sSL ${Loyalsoldier_direct} | grep -Ev "^(regexp|keyword|full):" | perl -ne '/^(domain:)?(.+)$/ && print ".$2\n"' >> direct.txt

          curl -sSL ${Loyalsoldier_direct} | grep -Ev "^(regexp|keyword):" | perl -ne '/^full:(.+)$/ && print "DOMAIN,$1\n"' > ruleset/direct.txt
          curl -sSL ${Loyalsoldier_direct} | grep -Ev "^(regexp|keyword|full):" | perl -ne '/^(domain:)?(.+)$/ && print "DOMAIN-SUFFIX,$2\n"' >> ruleset/direct.txt

      # ---------- Proxy ----------
      - name: Generate proxy rules
        run: |
          curl -sSL ${Loyalsoldier_proxy} | grep -Ev "^(regexp|keyword):" | perl -ne '/^full:(.+)$/ && print "$1\n"' > proxy.txt
          curl -sSL ${Loyalsoldier_proxy} | grep -Ev "^(regexp|keyword|full):" | perl -ne '/^(domain:)?(.+)$/ && print ".$2\n"' >> proxy.txt

          curl -sSL ${Loyalsoldier_proxy} | grep -Ev "^(regexp|keyword):" | perl -ne '/^full:(.+)$/ && print "DOMAIN,$1\n"' > ruleset/proxy.txt
          curl -sSL ${Loyalsoldier_proxy} | grep -Ev "^(regexp|keyword|full):" | perl -ne '/^(domain:)?(.+)$/ && print "DOMAIN-SUFFIX,$2\n"' >> ruleset/proxy.txt

      # ---------- Reject ----------
      - name: Generate reject rules
        run: |
          curl -sSL ${Loyalsoldier_reject} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(domain:|full:)?(.+)$/ && print ".$2\n"' > reject.txt
          curl -sSL ${Loyalsoldier_reject} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(domain:|full:)?(.+)$/ && print "DOMAIN-SUFFIX,$2\n"' > ruleset/reject.txt

      # ---------- Private ----------
      - name: Generate private rules
        run: |
          curl -sSL ${custom_private} | awk -F ':' '/^full:/ {print $2}' > private.txt
          curl -sSL ${custom_private} | awk -F ':' '/^domain:/ {print "."$2}' >> private.txt

          curl -sSL ${custom_private} | awk -F ':' '/^full:/ {print "DOMAIN,"$2}' > ruleset/private.txt
          curl -sSL ${custom_private} | awk -F ':' '/^domain:/ {print "DOMAIN-SUFFIX,"$2}' >> ruleset/private.txt

      # ---------- GFW ----------
      - name: Generate gfw rules
        run: |
          curl -sSL ${Loyalsoldier_gfw} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(domain:|full:)?(.+)$/ && print ".$2\n"' > gfw.txt
          curl -sSL ${Loyalsoldier_gfw} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(domain:|full:)?(.+)$/ && print "DOMAIN-SUFFIX,$2\n"' > ruleset/gfw.txt

      # ---------- Greatfire ----------
      - name: Generate greatfire rules
        run: |
          curl -sSL ${Loyalsoldier_greatfire} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(domain:|full:)?(.+)$/ && print ".$2\n"' > greatfire.txt
          curl -sSL ${Loyalsoldier_greatfire} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(domain:|full:)?(.+)$/ && print "DOMAIN-SUFFIX,$2\n"' > ruleset/greatfire.txt

      # ---------- CIDR ----------
      - name: Generate CIDR rules
        run: |
          curl -sSL ${cn_cidr} | perl -ne '/^(\d+\.\d+\.\d+\.\d+\/\d+)/ && print "IP-CIDR,$1\n"' > cncidr.txt
          curl -sSL ${cn_cidr} | perl -ne '/^(\d+\.\d+\.\d+\.\d+\/\d+)/ && print "IP-CIDR,$1\n"' > ruleset/cncidr.txt

          curl -sSL ${telegram_cidr} | perl -ne '/^(\d+\.\d+\.\d+\.\d+\/\d+)/ && print "IP-CIDR,$1\n"' > telegramcidr.txt
          curl -sSL ${telegram_cidr} | perl -ne '/^(\d+\.\d+\.\d+\.\d+\/\d+)/ && print "IP-CIDR,$1\n"' > ruleset/telegramcidr.txt

      # ---------- publish ----------
      - name: Prepare publish
        run: |
          cp *.txt publish/
          cp -r ruleset publish/

      # ---------- GitHub Release ----------
      - name: Release assets
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          files: publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Push release branch ----------
      - name: Push release branch
        run: |
          cd publish
          git init
          git checkout -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin release

      # ---------- CDN purge ----------
      - name: Purge jsDelivr
        run: |
          cd publish
          for file in *.txt; do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/$file"
          done
          for file in ruleset/*.txt; do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/$file"
          done
