name: Sync Multiple Repositories

on:
  schedule:
    # 每天北京时间 08:00
    # UTC 00:00
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        repo:

          # Repcz Tool
          - source: https://github.com/Repcz/Tool.git
            source_branch: X
            target_branch: tool


          # MetaCubeX meta-rules-dat
          - source: https://github.com/MetaCubeX/meta-rules-dat.git
            source_branch: meta
            target_branch: meta_rules


          # Loyalsoldier surge-rules
          - source: https://github.com/Loyalsoldier/surge-rules.git
            source_branch: release
            target_branch: surge-rules

          - source: https://github.com/blackmatrix7/ios_rule_script.git
            source_branch: master
            target_branch: ios_rule_script


    steps:

      - name: Sync ${{ matrix.repo.source }}

        env:
          TARGET_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

        run: |

          echo "=================================="
          echo "Sync:"
          echo "${{ matrix.repo.source }}"
          echo "Source branch:"
          echo "${{ matrix.repo.source_branch }}"
          echo "Target branch:"
          echo "${{ matrix.repo.target_branch }}"
          echo "=================================="


          rm -rf source
          rm -rf target


          #################################
          # 浅克隆源仓库，只下载最新提交
          #################################

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${{ matrix.repo.source_branch }}" \
            "${{ matrix.repo.source }}" \
            source


          #################################
          # 创建新的干净 Git 仓库
          #################################

          mkdir target

          cp -a source/. target/


          cd target


          rm -rf .git


          git init


          git config user.name "github-actions"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          #################################
          # 提交最新文件
          #################################

          git add .


          git commit \
            -m "$(cd ../source && git log -1 --pretty=%B)"



          #################################
          # 推送目标分支
          #################################

          git remote add origin "$TARGET_REPO"


          for attempt in 1 2 3
          do

            echo "Push attempt ${attempt}/3"


            git push \
              origin \
              HEAD:${{ matrix.repo.target_branch }} \
              --force \
              && break


            echo "Push failed, retry..."

            sleep 15


          done
